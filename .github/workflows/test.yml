name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scenarios:
    name: Сценарии на подставном adb (pwsh 7, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -v && python3 --version && java -version
      - run: bash tests/run.sh
      - name: car-kit Mobile — логика, протокол ADB, беспроводная отладка, совпадение плана с набором
        run: |
          CV=2.5.2; J="$RUNNER_TEMP/conscrypt-openjdk-uber-$CV.jar"; U="https://repo1.maven.org/maven2/org/conscrypt/conscrypt-openjdk-uber/$CV/conscrypt-openjdk-uber-$CV.jar"
          curl -fsSL -o "$J" "$U"; [ "$(curl -fsSL "$U.sha1" | cut -c1-40)" = "$(sha1sum "$J" | cut -c1-40)" ] || { echo "conscrypt sha1 mismatch"; exit 1; }
          CONSCRYPT_JAR="$J" ADB_BIN="$ANDROID_HOME/platform-tools/adb" bash tests/mobile/run.sh

  windows-ps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кодировки (BOM + CRLF, .bat — ASCII, start.command — LF)
        shell: powershell
        # Встроенный код раннер сохраняет без BOM, PowerShell 5.1 читает его как ANSI — только латиница.
        run: |
          $b = [IO.File]::ReadAllBytes("$PWD\carkit.ps1")
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { throw 'carkit.ps1: no UTF-8 BOM' }
          $t = [IO.File]::ReadAllText("$PWD\carkit.ps1")
          if (($t -replace "`r`n", '') -match "`n") { throw 'carkit.ps1: line endings must be CRLF' }
          foreach ($f in 'start.bat', 'prepare.bat') { if ([IO.File]::ReadAllBytes("$PWD\$f") | Where-Object { $_ -gt 127 }) { throw "${f}: must be ASCII" } }
          if ([IO.File]::ReadAllText("$PWD\start.command") -match "`r") { throw 'start.command: line endings must be LF' }
          'ok'
      - name: Разбор carkit.ps1 в Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\carkit.ps1", [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'ok'
      - name: Пункт U (кабель) на подставных данных
        shell: powershell
        run: .\tests\usbtest.ps1
      - name: Веб-интерфейс в Windows PowerShell 5.1
        shell: pwsh
        run: python tests/webtest.py powershell

  launcher:
    name: Сборка APK (car-launcher, car-kit Mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          KS_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
          LAUNCHER_KS_PASS: ${{ secrets.LAUNCHER_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"; export LAUNCHER_KEYSTORE="$RUNNER_TEMP/ks.p12"; fi
          bash launcher/build.sh "$PWD/out/car-launcher.apk"
          bash mobile/build.sh "$PWD/out/car-kit-mobile.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            out/car-launcher.apk
            out/car-kit-mobile.apk

  emulator:
    name: Настоящий Android 11 (эмулятор) — набор, лаунчер, car-kit Mobile
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kit and launcher on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/emu.sh "$PWD/out/car-launcher.apk" "$PWD/out/car-kit-mobile.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: emu-logs
